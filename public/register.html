<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account – OAuth 2.1 Provider</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 to-slate-800 flex items-center justify-center px-4">

  <div class="w-full max-w-md">
    <!-- Logo / title -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600 mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" stroke-width="2"
          viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1
               1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white">OAuth 2.1 Provider</h1>
      <p class="text-slate-400 mt-1">Create your account</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-2xl p-8">

      <!-- Error alert -->
      <div id="error-banner"
        class="mb-6 rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700 hidden">
        <span id="error-text">{{ERROR}}</span>
      </div>

      <form id="register-form" method="POST" action="/register" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{CSRF_TOKEN}}" />

        <div>
          <label for="username" class="block text-sm font-medium text-slate-700 mb-1">
            Username
          </label>
          <input
            id="username"
            name="username"
            type="text"
            required
            autocomplete="username"
            placeholder="alice"
            class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-slate-900
                   placeholder-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200
                   outline-none transition"
          />
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1">
            Email address
          </label>
          <input
            id="email"
            name="email"
            type="email"
            required
            autocomplete="email"
            placeholder="alice@example.com"
            class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-slate-900
                   placeholder-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200
                   outline-none transition"
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1">
            Password
            <span class="text-slate-400 font-normal">(min. 8 characters)</span>
          </label>
          <input
            id="password"
            name="password"
            type="password"
            required
            autocomplete="new-password"
            placeholder="••••••••"
            minlength="8"
            class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-slate-900
                   placeholder-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200
                   outline-none transition"
          />
        </div>

        <div>
          <label for="confirm_password" class="block text-sm font-medium text-slate-700 mb-1">
            Confirm password
          </label>
          <input
            id="confirm_password"
            name="confirm_password"
            type="password"
            required
            autocomplete="new-password"
            placeholder="••••••••"
            minlength="8"
            class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-slate-900
                   placeholder-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200
                   outline-none transition"
          />
        </div>

        <button
          type="submit"
          id="submit-btn"
          class="w-full rounded-lg bg-indigo-600 py-2.5 text-sm font-semibold text-white
                 hover:bg-indigo-700 active:scale-[0.98] transition-all focus:outline-none
                 focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 disabled:opacity-50"
        >
          Create account
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-500">
        Already have an account?
        <a href="/login" class="text-indigo-600 hover:text-indigo-700 font-medium">Sign in</a>
      </p>
    </div>
  </div>

  <script src="/js/register.js" defer></script>
</body>
</html>
